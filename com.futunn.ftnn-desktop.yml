app-id: com.futunn.ftnn-desktop
runtime: org.freedesktop.Platform
runtime-version: '25.08' # Choose a stable, supported version
sdk: org.freedesktop.Sdk
command: /app/lib/FTNN/FTNN
finish-args:
  # Basic permissions for a GUI app. Adjust as needed.
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --persist=.config/FTNN
  - --persist=.config/Futu-Linux
  - --persist=Library
  # Input Method (Fcitx5 via IBus emulation)
  - --talk-name=org.freedesktop.IBus
  - --talk-name=org.fcitx.Fcitx
  - --talk-name=org.fcitx.Fcitx5
  - --talk-name=org.freedesktop.portal.Fcitx
  - --env=QT_IM_MODULE=ibus
modules:
  - name: ftnn-desktop
    buildsystem: simple
    build-options:
      strip: false
      no-debuginfo: true
    sources:
      - type: file
        url: https://softwaredownload.futunn.com/FTNN_desktop_16.11.15608_amd64.deb
        sha256: 6f4079757d2d8d12956e9de3b489cf6bf63d427b83cb499d86771d3e590140f7
      - type: file
        path: com.futunn.ftnn-desktop.desktop
      - type: file
        path: icon_512.png
    build-commands:
      - ar x FTNN_desktop_16.11.15608_amd64.deb
      - tar -xvf data.tar.xz ./opt/FTNN/
      - mkdir -m0755 /app/lib
      - mv ./opt/FTNN /app/lib/
      - install -Dm644 com.futunn.ftnn-desktop.desktop /app/share/applications/com.futunn.ftnn-desktop.desktop
      - install -Dm644 icon_512.png /app/share/icons/hicolor/512x512/apps/com.futunn.ftnn-desktop.png
